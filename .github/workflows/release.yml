# 在发布 Release 时自动构建 Windows x64 EXE 并挂到 Release 附件；
# 手动触发（workflow_dispatch）时构建并上传为 Actions 工件。
name: Build & Release EXE

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm MarkItDown.spec

      - name: Attach EXE to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MarkItDown.exe
          generate_release_notes: true

      - name: Upload EXE as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-win-x64
          path: dist/MarkItDown.exe
