name: lint
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Syntax check
        run: python -m py_compile markitdown_gui.py
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check mdgui/ markitdown_gui.py _pyinstaller_runtime_hook.py _internal_patches/ tests/
      - name: Install deps & import check
        run: |
          pip install -r requirements.txt
          python -c "import markitdown_gui"
      - name: Unit tests
        run: |
          pip install pytest
          pytest tests/ -v
